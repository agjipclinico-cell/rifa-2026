<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Iniciar sesión | Asistencia</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
    <script src="auth.js" defer></script>
</head>
<body data-page="login">
    <main class="card login-card">
        <header class="card-header">
            <p class="eyebrow">PUNTO CLÍNICO · RIFA 2026</p>
            <h1 data-app-title>Control de asistencia</h1>
            <p class="subtitle">Inicia sesión para registrar entradas.</p>
        </header>
        <form id="loginForm" class="card-body">
            <label for="username">Usuario</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
            <button id="loginButton" class="primary" type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
